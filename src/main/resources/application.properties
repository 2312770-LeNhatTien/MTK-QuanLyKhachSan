spring.application.name=khachsan
server.port=8080
server.servlet.session.cookie.name=KHACHSAN_SESSION

spring.datasource.url=jdbc:mysql://localhost:3307/quan_ly_khach_san?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:khachsan_demo}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.flyway.enabled=true

spring.thymeleaf.cache=false
spring.jackson.time-zone=Asia/Ho_Chi_Minh

app.email-log-dir=email-logs

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never
