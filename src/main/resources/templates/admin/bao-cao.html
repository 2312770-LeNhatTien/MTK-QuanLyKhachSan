<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout/chung::head('Báo cáo doanh thu')}"></head><body class="admin-body"><div class="admin-shell"><aside th:replace="~{layout/admin::sidebar}"></aside><div class="admin-main"><header th:replace="~{layout/admin::topbar}"></header><main class="admin-content"><h1>Báo cáo doanh thu</h1><div th:replace="~{layout/chung::thongBao}"></div><form method="get" th:object="${khoangNgayDto}" class="content-card mb-4 needs-validation" novalidate><div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}"><p th:each="e:${#fields.allErrors()}" th:text="${e}" class="mb-0"></p></div><div class="row g-3 align-items-end"><div class="col-md-4"><label class="form-label" for="tuNgay">Từ ngày</label><input type="date" class="form-control" th:field="*{tuNgay}" required></div><div class="col-md-4"><label class="form-label" for="denNgay">Đến ngày</label><input type="date" class="form-control" th:field="*{denNgay}" required></div><div class="col-md-4"><button class="btn btn-primary">Xem báo cáo</button></div></div></form>
<th:block th:if="${bc}"><div class="row g-3 mb-4"><div class="col-md-4"><article class="content-card"><h2 class="h6">Doanh thu đã thu</h2><strong class="h3" th:text="${@dinhDang.tien(bc.doanhThu)}"></strong></article></div><div class="col-md-4"><article class="content-card"><h2 class="h6">Công suất phòng</h2><strong class="h3" th:text="${bc.congSuat+'%'}"></strong><p class="small mb-0" th:text="${bc.demPhong+' / '+bc.sucChuaDemPhong+' đêm-phòng'}"></p></article></div><div class="col-md-4"><article class="content-card"><h2 class="h6">Cơ sở tính</h2><p class="mb-0">Doanh thu theo ngày giao dịch thành công. Công suất theo phần đêm lưu trú trong khoảng đã chọn.</p></article></div></div>
<section class="content-card mb-4"><h2 class="h5">Doanh thu từng ngày</h2><div style="height:300px"><canvas id="bieuDoDoanhThu" aria-label="Biểu đồ cột doanh thu theo ngày" role="img"></canvas></div><div class="table-responsive mt-4" style="max-height:340px"><table class="table" id="bangDoanhThu"><thead><tr><th>Ngày</th><th>Doanh thu</th></tr></thead><tbody><tr th:each="n:${bc.theoNgay}" th:attr="data-ngay=${@dinhDang.ngay(n.key)},data-tien=${n.value}"><td th:text="${@dinhDang.ngay(n.key)}"></td><td th:text="${@dinhDang.tien(n.value)}"></td></tr></tbody></table></div></section>
<div class="row g-3"><div class="col-lg-6"><section class="content-card h-100"><h2 class="h5">Theo phương thức</h2><table class="table"><thead><tr><th>Phương thức</th><th>Doanh thu</th></tr></thead><tbody><tr th:each="p:${bc.theoPhuongThuc}"><td th:text="${@thanhToanService.tenPhuongThuc(p.key)}"></td><td th:text="${@dinhDang.tien(p.value)}"></td></tr></tbody></table></section></div><div class="col-lg-6"><section class="content-card h-100"><h2 class="h5">Số đơn theo ngày đặt</h2><table class="table"><thead><tr><th>Trạng thái</th><th>Số đơn</th></tr></thead><tbody><tr th:each="t:${bc.soDon}"><td th:text="${t.key.tenHienThi}"></td><td th:text="${t.value}"></td></tr></tbody></table></section></div></div></th:block></main></div></div><th:block th:replace="~{layout/chung::scripts}"></th:block><script src="/vendor/chartjs/chart.umd.min.js"></script><script src="/js/bao-cao.js"></script></body></html>
