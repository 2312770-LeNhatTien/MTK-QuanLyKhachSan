<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout/chung::head('Nhận và trả phòng')}"></head><body class="admin-body"><div class="admin-shell"><aside th:replace="~{layout/admin::sidebar}"></aside><div class="admin-main"><header th:replace="~{layout/admin::topbar}"></header><main class="admin-content"><h1 th:text="${traPhong?'Check-out':'Check-in'}"></h1><div th:replace="~{layout/chung::thongBao}"></div>
<form method="get" class="content-card d-flex gap-3 mb-4"><label class="flex-grow-1">Tra cứu đơn<input class="form-control" name="tuKhoa" th:value="${tuKhoa}" th:placeholder="${traPhong?'Mã đặt phòng hoặc số phòng':'Mã đặt phòng'}" required maxlength="10"></label><button class="btn btn-primary align-self-end">Tìm đơn</button></form>
<th:block th:if="${ct}"><section th:replace="~{dat-phong/noi-dung-chi-tiet::noiDung}"></section><div class="content-card mt-4" th:if="${ct.don.trangThai.name()=='DA_XAC_NHAN'}">
<form th:unless="${traPhong}" th:action="@{/admin/nhan-tra-phong/check-in/{ma}(ma=${ct.don.maDatPhong})}" method="post"><button class="btn btn-primary">Check-in</button></form>
<th:block th:if="${traPhong}"><form th:if="${ct.conLai.signum()>0}" th:action="@{/admin/nhan-tra-phong/check-out/{ma}/thu-tien(ma=${ct.don.maDatPhong})}" method="post" th:object="${thuTienDto}" class="needs-validation" novalidate><h2 class="h5">Thu tiền còn lại tại quầy</h2><div class="row g-3"><div class="col-md-3"><label class="form-label">Số tiền cần thu</label><input class="form-control" th:value="${@dinhDang.tien(ct.conLai)}" readonly></div><div class="col-md-3"><label class="form-label" for="maPhuongThuc">Phương thức</label><select class="form-select" th:field="*{maPhuongThuc}" required><option value="">Chọn phương thức</option><option th:each="p:${phuongThuc}" th:value="${p.ma}" th:text="${p.tenHienThi}"></option></select></div><div class="col-md-3"><label class="form-label" for="tienKhachDua">Tiền khách đưa (tiền mặt)</label><input class="form-control" type="number" min="0" max="9999999999.99" step="0.01" th:field="*{tienKhachDua}"></div><div class="col-md-3"><label class="form-label" for="maChuanChi">Mã chuẩn chi (thẻ)</label><input class="form-control" inputmode="numeric" maxlength="6" th:field="*{maChuanChi}"></div></div><button class="btn btn-primary mt-3">Thu tiền</button><p class="small text-secondary mt-2">Tiền mặt: nhập tiền khách đưa. Thẻ: nhập mã chuẩn chi giả lập gồm đúng 6 chữ số.</p></form>
<form th:if="${ct.conLai.signum()==0}" th:action="@{/admin/nhan-tra-phong/check-out/{ma}(ma=${ct.don.maDatPhong})}" method="post"><button class="btn btn-primary">Hoàn tất trả phòng</button></form></th:block></div></th:block>
</main></div></div><th:block th:replace="~{layout/chung::scripts}"></th:block></body></html>
