<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout/chung::head('Tình trạng phòng')}"></head><body class="admin-body"><div class="admin-shell"><aside th:replace="~{layout/admin::sidebar}"></aside><div class="admin-main"><header th:replace="~{layout/admin::topbar}"></header><main class="admin-content"><h1>Tình trạng phòng</h1><div th:replace="~{layout/chung::thongBao}"></div><section class="content-card mb-4"><h2 class="h5">Phòng cần dọn</h2><p th:if="${#lists.isEmpty(canDon)}">Hiện không có phòng cần dọn.</p><div class="d-flex flex-wrap gap-2"><a class="btn btn-outline-primary" th:each="p:${canDon}" th:href="${'#phong-'+p.maPhong}" th:text="${'Phòng '+p.soPhong}"></a></div></section>
<section class="mb-4" th:each="tang:${theoTang}"><h2 class="h4" th:text="${tang.key==0?'Chưa xác định tầng':'Tầng '+tang.key}"></h2><div class="row g-3"><div class="col-sm-6 col-xl-3" th:each="p:${tang.value}"><article class="content-card h-100" th:id="${'phong-'+p.maPhong}"><h3 class="h4" th:text="${'Phòng '+p.soPhong}"></h3><p th:text="${p.loaiPhong.tenLoaiPhong}"></p><p><i class="bi" aria-hidden="true" th:classappend="${bieuTuong[p.trangThai]}"></i> <strong th:text="${p.layTrangThai().tenHienThi}"></strong></p><form th:each="tac:${p.layTrangThai().thaoTacHopLe()}" th:if="${tenThaoTac.containsKey(tac.name())}" th:action="@{/admin/phong/tinh-trang/{ma}(ma=${p.maPhong})}" method="post" class="d-inline-block m-1"><input type="hidden" name="thaoTac" th:value="${tac.name()}"><button class="btn btn-sm btn-outline-primary" th:text="${tenThaoTac[tac.name()]}"></button></form></article></div></div></section></main></div></div><th:block th:replace="~{layout/chung::scripts}"></th:block></body></html>
