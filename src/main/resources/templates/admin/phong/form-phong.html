<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout/chung::head('Thông tin phòng')}"></head><body class="admin-body"><div class="admin-shell"><aside th:replace="~{layout/admin::sidebar}"></aside><div class="admin-main"><header th:replace="~{layout/admin::topbar}"></header><main class="admin-content"><h1>Thông tin phòng</h1><div th:replace="~{layout/chung::thongBao}"></div><form th:action="${ma==null?'/admin/phong/them':'/admin/phong/'+ma+'/sua'}" th:object="${phongDto}" method="post" class="content-card needs-validation" novalidate><div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}"><p th:each="e:${#fields.allErrors()}" th:text="${e}" class="mb-0"></p></div><div class="row g-3"><div class="col-md-4"><label class="form-label" for="soPhong">Số phòng</label><input class="form-control" th:field="*{soPhong}" required pattern="[A-Za-z0-9]{1,9}" maxlength="9" th:readonly="${ma!=null}"></div><div class="col-md-4"><label class="form-label" for="tang">Tầng</label><input class="form-control" type="number" th:field="*{tang}" min="-2147483648" max="2147483647"></div><div class="col-md-4"><label class="form-label" for="maLoaiPhong">Loại phòng</label><select class="form-select" th:field="*{maLoaiPhong}" required><option value="">Chọn loại phòng</option><option th:each="l:${dsLoai}" th:value="${l.maLoaiPhong}" th:text="${l.tenLoaiPhong}"></option></select></div></div><p class="small text-secondary mt-3">Số phòng được giữ cố định sau khi tạo để bảo toàn mã phòng.</p><button class="btn btn-primary">Lưu phòng</button> <a class="btn btn-link" th:href="@{/admin/phong}">Quay lại</a></form></main></div></div><th:block th:replace="~{layout/chung::scripts}"></th:block></body></html>
