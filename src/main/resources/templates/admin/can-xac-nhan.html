<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout/chung::head('Đơn cần nhận phụ trách')}"></head><body class="admin-body"><div class="admin-shell"><aside th:replace="~{layout/admin::sidebar}"></aside><div class="admin-main"><header th:replace="~{layout/admin::topbar}"></header><main class="admin-content"><h1>Đơn cần nhận phụ trách</h1><p class="text-secondary">Đơn đã xác nhận, chưa có lễ tân phụ trách, nhận phòng trong 7 ngày kể từ hôm nay.</p><div th:replace="~{layout/chung::thongBao}"></div><div class="content-card table-responsive"><table class="table"><thead><tr><th>Mã đơn</th><th>Khách</th><th>Ngày nhận</th><th>Số phòng</th><th></th></tr></thead><tbody><tr th:each="d:${dsDon}"><td th:text="${d.maDatPhong}"></td><td th:text="${d.khachHang.hoTen}"></td><td th:text="${@dinhDang.ngay(d.ngayNhanPhong)}"></td><td th:text="${#lists.size(d.dsChiTietDatPhong)}"></td><td><form th:action="@{/admin/dat-phong/can-xac-nhan/{ma}(ma=${d.maDatPhong})}" method="post"><button class="btn btn-primary btn-sm">Nhận phụ trách</button></form></td></tr><tr th:if="${#lists.isEmpty(dsDon)}"><td colspan="5">Không có đơn cần nhận phụ trách.</td></tr></tbody></table></div></main></div></div><th:block th:replace="~{layout/chung::scripts}"></th:block></body></html>
