<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/chung :: head('Đăng nhập nhân viên')}"></head>
<body class="staff-login-page">
<main class="staff-login-shell">
    <a class="brand mb-5" th:href="@{/}"><span class="brand-mark"><i class="bi bi-buildings" aria-hidden="true"></i></span> KHÁCH SẠN</a>
    <section class="auth-card" aria-labelledby="tieuDe">
        <span class="staff-login-icon"><i class="bi bi-person-badge" aria-hidden="true"></i></span>
        <p class="eyebrow mt-4">KHÔNG GIAN LÀM VIỆC</p><h1 id="tieuDe" class="h3">Đăng nhập nhân viên</h1><p class="text-secondary mb-4">Dành cho lễ tân, quản lý và buồng phòng.</p>
        <div class="alert alert-danger" role="alert" th:if="${param.loi != null}">Email hoặc mật khẩu không đúng.</div>
        <div class="alert alert-success" role="status" th:if="${param['dang-xuat'] != null}">Bạn đã đăng xuất.</div>
        <form th:action="@{/admin/dang-nhap}" method="post" data-kiem-tra>
            <div class="mb-3"><label class="form-label" for="email">Email nhân viên</label><input class="form-control" type="email" id="email" name="email" required maxlength="100" autocomplete="username"></div>
            <div class="mb-4"><label class="form-label" for="password">Mật khẩu</label><input class="form-control" type="password" id="password" name="password" required autocomplete="current-password"></div>
            <button class="btn btn-primary w-100" type="submit">Vào trang quản trị <i class="bi bi-arrow-right ms-2" aria-hidden="true"></i></button>
        </form>
    </section>
    <a class="small mt-4" th:href="@{/}"><i class="bi bi-arrow-left me-2" aria-hidden="true"></i> Về website khách hàng</a>
</main>
<th:block th:replace="~{layout/chung :: scripts}"></th:block>
</body>
</html>
