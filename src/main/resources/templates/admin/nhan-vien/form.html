<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout/chung::head('Thông tin nhân viên')}"></head><body class="admin-body"><div class="admin-shell"><aside th:replace="~{layout/admin::sidebar}"></aside><div class="admin-main"><header th:replace="~{layout/admin::topbar}"></header><main class="admin-content"><h1>Thông tin nhân viên</h1><div th:replace="~{layout/chung::thongBao}"></div><form th:action="${ma==null?'/admin/nhan-vien/them':'/admin/nhan-vien/'+ma+'/sua'}" th:object="${nhanVienDto}" method="post" class="content-card needs-validation mb-4" novalidate><div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}"><p th:each="e:${#fields.allErrors()}" th:text="${e}" class="mb-0"></p></div><div class="row g-3"><div class="col-md-6"><label class="form-label" for="hoTen">Họ tên</label><input class="form-control" th:field="*{hoTen}" required maxlength="100"></div><div class="col-md-6"><label class="form-label" for="email">Email</label><input class="form-control" th:field="*{email}" type="email" required maxlength="100"></div><div class="col-md-6"><label class="form-label" for="sdt">Số điện thoại</label><input class="form-control" th:field="*{sdt}" maxlength="15"></div><div class="col-md-6"><label class="form-label" for="maVaiTro">Vai trò</label><select class="form-select" th:field="*{maVaiTro}" required><option value="">Chọn vai trò</option><option th:each="v:${dsVaiTro}" th:value="${v.maVaiTro}" th:text="${v.tenVaiTro}"></option></select></div><div class="col-md-6" th:if="${ma==null}"><label class="form-label" for="matKhau">Mật khẩu ban đầu</label><input class="form-control" type="password" name="matKhau" id="matKhau" required minlength="6" maxlength="72" autocomplete="new-password"></div></div><button class="btn btn-primary mt-4">Lưu nhân viên</button> <a class="btn btn-link" th:href="@{/admin/nhan-vien}">Quay lại</a></form>
<form th:if="${ma!=null}" th:action="@{/admin/nhan-vien/{ma}/mat-khau(ma=${ma})}" method="post" class="content-card needs-validation" novalidate><h2 class="h5">Đặt lại mật khẩu</h2><label class="form-label" for="matKhauMoi">Mật khẩu mới</label><input class="form-control mb-3" type="password" name="matKhau" id="matKhauMoi" required minlength="6" maxlength="72" autocomplete="new-password"><button class="btn btn-outline-primary">Đặt lại mật khẩu</button></form></main></div></div><th:block th:replace="~{layout/chung::scripts}"></th:block></body></html>
