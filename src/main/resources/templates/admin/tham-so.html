<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout/chung::head('Cấu hình tham số')}"></head><body class="admin-body"><div class="admin-shell"><aside th:replace="~{layout/admin::sidebar}"></aside><div class="admin-main"><header th:replace="~{layout/admin::topbar}"></header><main class="admin-content"><h1>Cấu hình tham số</h1><div th:replace="~{layout/chung::thongBao}"></div><p class="text-secondary">Giá trị thay đổi có hiệu lực ngay. Tỉ lệ đặt cọc từ 1 đến 100%; các tham số khác là số nguyên dương.</p><div class="row g-3"><div class="col-xl-4" th:each="t:${dsThamSo}"><form class="content-card h-100 needs-validation" novalidate th:action="@{/admin/tham-so/{ma}(ma=${t.maThamSo})}" method="post"><h2 class="h5" th:text="${t.tenThamSo}"></h2><label class="form-label" th:for="${t.maThamSo}" th:text="${'Giá trị ('+t.donVi+')'}"></label><input class="form-control" th:id="${t.maThamSo}" type="number" name="giaTri" th:value="${t.giaTri}" min="1" step="1" th:max="${t.maThamSo=='TI_LE_DAT_COC'?'100':'9999999999'}" required><button class="btn btn-primary mt-3">Lưu thay đổi</button></form></div></div></main></div></div><th:block th:replace="~{layout/chung::scripts}"></th:block></body></html>
