<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout/chung::head('Quản lý đặt phòng')}"></head><body class="admin-body"><div class="admin-shell"><aside th:replace="~{layout/admin::sidebar}"></aside><div class="admin-main"><header th:replace="~{layout/admin::topbar}"></header><main class="admin-content"><h1>Quản lý đặt phòng</h1><div th:replace="~{layout/chung::thongBao}"></div><form method="get" th:object="${locDonDto}" class="content-card mb-4"><div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}"><p class="mb-0" th:each="e:${#fields.allErrors()}" th:text="${e}"></p></div><div class="row g-3"><div class="col-md-3"><label for="trangThai" class="form-label">Trạng thái</label><select th:field="*{trangThai}" class="form-select"><option value="">Tất cả</option><option th:each="t:${trangThai}" th:value="${t}" th:text="${t.tenHienThi}"></option></select></div><div class="col-md-2"><label for="tuNgay" class="form-label">Đặt từ ngày</label><input class="form-control" type="date" th:field="*{tuNgay}"></div><div class="col-md-2"><label for="denNgay" class="form-label">Đến ngày</label><input class="form-control" type="date" th:field="*{denNgay}"></div><div class="col-md-2"><label for="ma" class="form-label">Mã đơn</label><input class="form-control" th:field="*{ma}" maxlength="10"></div><div class="col-md-3"><label for="email" class="form-label">Email khách</label><input class="form-control" th:field="*{email}" maxlength="100"></div></div><button class="btn btn-primary mt-3">Lọc đơn</button></form>
<div class="content-card table-responsive"><table class="table"><thead><tr><th>Mã đơn</th><th>Khách</th><th>Ngày đặt</th><th>Nhận / Trả</th><th>Tổng tiền</th><th>Trạng thái</th><th></th></tr></thead><tbody><tr th:each="d:${dsDon}"><td th:text="${d.maDatPhong}"></td><td th:text="${d.khachHang.email}"></td><td th:text="${@dinhDang.ngayGio(d.ngayDat)}"></td><td><span th:text="${@dinhDang.ngay(d.ngayNhanPhong)}"></span> – <span th:text="${@dinhDang.ngay(d.ngayTraPhong)}"></span></td><td th:text="${@dinhDang.tien(d.tongTien)}"></td><td th:text="${d.trangThai.tenHienThi}"></td><td><a th:href="@{/admin/dat-phong/{ma}(ma=${d.maDatPhong})}">Chi tiết</a></td></tr><tr th:if="${#lists.isEmpty(dsDon)}"><td colspan="7">Không có đơn phù hợp.</td></tr></tbody></table></div></main></div></div><th:block th:replace="~{layout/chung::scripts}"></th:block></body></html>
