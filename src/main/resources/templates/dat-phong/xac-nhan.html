<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout/chung::head('Xác nhận đặt phòng')}"></head><body><header th:replace="~{layout/khach::dauTrang}"></header>
<main class="container page-section"><p class="eyebrow">LỰA CHỌN CỦA BẠN</p><h1 class="h2">Xác nhận đặt phòng</h1><p><strong th:text="${don.khachHang.hoTen}"></strong> · <span th:text="${@dinhDang.ngay(don.ngayNhanPhong)}"></span> – <span th:text="${@dinhDang.ngay(don.ngayTraPhong)}"></span></p>
<div th:replace="~{layout/chung::thongBao}"></div><div class="alert alert-danger d-none" id="loiTamTinh" role="alert"></div>
<form th:action="@{/dat-phong/xac-nhan}" method="post" id="formDatPhong" data-kiem-tra>
<input type="hidden" name="ngayNhanPhong" th:value="${don.ngayNhanPhong}"><input type="hidden" name="ngayTraPhong" th:value="${don.ngayTraPhong}">
<div class="row g-4"><div class="col-lg-6"><section class="content-card mb-4"><h2 class="h5">Phòng và số khách</h2><div class="mb-3" th:each="ct:${don.dsChiTietDatPhong}"><label class="form-label" th:for="${ct.phong.maPhong}">Phòng <span th:text="${ct.phong.soPhong}"></span> · <span th:text="${ct.phong.loaiPhong.tenLoaiPhong}"></span></label><input class="form-control" type="number" th:id="${ct.phong.maPhong}" th:name="'phong['+${ct.phong.maPhong}+']'" th:value="${ct.soLuongKhach}" min="1" th:max="${ct.phong.loaiPhong.sucChua}" required></div></section>
<section class="content-card"><h2 class="h5">Dịch vụ thêm</h2><p class="small text-secondary">Chọn dịch vụ ngay khi đặt phòng, số lượng từ 1 đến 10.</p><div class="service-choice" th:each="dv:${dsDichVu}"><div class="form-check"><input type="checkbox" class="form-check-input chonDichVu" th:id="'chon-'+${dv.maDichVu}" th:attr="data-so-luong=${dv.maDichVu}"><label class="form-check-label" th:for="'chon-'+${dv.maDichVu}"><span th:text="${dv.tenDichVu}"></span><small class="d-block text-secondary"><span th:text="${@dinhDang.tien(dv.donGia)}"></span> / <span th:text="${dv.donViTinh}"></span> · <span th:text="${dv.cachTinh.tenHienThi}"></span></small></label></div><input type="number" min="1" max="10" value="1" disabled class="form-control service-qty" th:id="${dv.maDichVu}" th:name="'dichVu['+${dv.maDichVu}+']'" th:attr="aria-label='Số lượng '+${dv.tenDichVu}"></div></section></div>
<div class="col-lg-6"><section class="content-card"><h2 class="h5">Bảng tạm tính</h2><div th:replace="~{layout/chi-phi::bang(${chiPhi})}"></div><div class="small text-secondary mb-3">Đặt cọc theo mức tối thiểu của khách sạn. Đơn chưa thanh toán được giữ trong thời gian quy định hiển thị ở bước thanh toán.</div><div class="form-check mb-4"><input class="form-check-input" type="checkbox" id="dongYQuyDinh" name="dongYQuyDinh" value="true" required><label class="form-check-label" for="dongYQuyDinh">Tôi đồng ý quy định đặt phòng và thanh toán.</label></div><button class="btn btn-primary w-100" type="submit" id="xacNhanDatPhong">Xác nhận đặt phòng</button></section></div></div></form></main>
<footer th:replace="~{layout/khach::chanTrang}"></footer><th:block th:replace="~{layout/chung::scripts}"></th:block><script th:src="@{/js/dat-phong.js}"></script></body></html>
