<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout/chung::head('Lịch sử đặt phòng')}"></head><body><header th:replace="~{layout/khach::dauTrang}"></header><main class="container page-section"><p class="eyebrow">NHỮNG KỲ NGHỈ CỦA BẠN</p><h1 class="h2">Lịch sử đặt phòng</h1><div th:replace="~{layout/chung::thongBao}"></div><form th:action="@{/dat-phong/lich-su}" method="get" class="d-flex gap-3 my-4"><select class="form-select w-auto" name="trangThai" aria-label="Lọc trạng thái"><option value="">Tất cả trạng thái</option><option th:each="tt:${dsTrangThai}" th:value="${tt}" th:text="${tt.tenHienThi}" th:selected="${tt==trangThai}"></option></select><button class="btn btn-primary" type="submit">Lọc</button></form><div class="content-card table-responsive"><table class="table"><thead><tr><th>Mã đơn / ngày đặt</th><th>Nhận – trả phòng</th><th>Số phòng</th><th>Tổng tiền</th><th>Trạng thái</th><th></th></tr></thead><tbody><tr th:each="d:${dsDon}"><td><strong th:text="${d.maDatPhong}"></strong><small class="d-block text-secondary" th:text="${@dinhDang.ngayGio(d.ngayDat)}"></small></td><td><span th:text="${@dinhDang.ngay(d.ngayNhanPhong)}"></span> – <span th:text="${@dinhDang.ngay(d.ngayTraPhong)}"></span></td><td th:text="${#lists.size(d.dsChiTietDatPhong)}"></td><td th:text="${@dinhDang.tien(d.tongTien)}"></td><td th:text="${d.trangThai.tenHienThi}"></td><td><a th:href="@{/dat-phong/{ma}(ma=${d.maDatPhong})}">Chi tiết</a></td></tr><tr th:if="${#lists.isEmpty(dsDon)}"><td colspan="6">Chưa có đơn phù hợp.</td></tr></tbody></table></div></main><footer th:replace="~{layout/khach::chanTrang}"></footer><th:block th:replace="~{layout/chung::scripts}"></th:block></body></html>
