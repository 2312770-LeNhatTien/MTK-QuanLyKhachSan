<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><body><section th:fragment="noiDung">
<div class="d-flex flex-wrap justify-content-between gap-3 mb-4"><div><h1 class="h2" th:text="${ct.don.maDatPhong}"></h1><p th:text="${ct.don.trangThai.tenHienThi}"></p></div><div><strong th:text="${ct.don.khachHang.hoTen}"></strong><p class="text-secondary" th:text="${ct.don.khachHang.email}"></p></div></div><p>Nhận phòng: <strong th:text="${@dinhDang.ngay(ct.don.ngayNhanPhong)}"></strong> · Trả phòng: <strong th:text="${@dinhDang.ngay(ct.don.ngayTraPhong)}"></strong></p>
<div class="content-card mb-4"><h2 class="h5">Phòng đã đặt</h2><div class="d-flex flex-wrap gap-3"><div class="room-choice" th:each="p:${ct.don.dsChiTietDatPhong}">Phòng <strong th:text="${p.phong.soPhong}"></strong> · <span th:text="${p.soLuongKhach}"></span> khách <small class="d-block text-secondary" th:text="${p.phong.layTrangThai().tenHienThi}"></small></div></div></div>
<div class="content-card mb-4"><h2 class="h5">Chi phí lưu trú</h2><div th:replace="~{layout/chi-phi::bang(${ct.chiPhi})}"></div></div>
<div class="content-card"><h2 class="h5">Hóa đơn &amp; thanh toán</h2><p th:if="${ct.hoaDon}"><span th:text="${ct.hoaDon.maHoaDon}"></span> · <span th:text="${ct.hoaDon.trangThaiThanhToan.tenHienThi}"></span></p><p th:unless="${ct.hoaDon}" class="text-secondary">Chưa lập hóa đơn.</p><div class="table-responsive" th:unless="${#lists.isEmpty(ct.giaoDich)}"><table class="table"><thead><tr><th>Giao dịch</th><th>Thời điểm</th><th>Phương thức</th><th>Số tiền</th><th>Kết quả</th></tr></thead><tbody><tr th:each="t:${ct.giaoDich}"><td th:text="${t.maThanhToan}"></td><td th:text="${@dinhDang.ngayGio(t.ngayThanhToan)}"></td><td th:text="${@thanhToanService.tenPhuongThuc(t.phuongThuc)}"></td><td th:text="${@dinhDang.tien(t.soTien)}"></td><td th:text="${t.trangThai.tenHienThi}"></td></tr></tbody></table></div><div class="d-flex flex-wrap gap-4"><span>Đã trả: <strong th:text="${@dinhDang.tien(ct.daTra)}"></strong></span><span>Còn lại: <strong th:text="${@dinhDang.tien(ct.conLai)}"></strong></span></div></div>
</section></body></html>
