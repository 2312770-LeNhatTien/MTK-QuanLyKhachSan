<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout/chung::head('Đánh giá kỳ nghỉ')}"></head><body><header th:replace="~{layout/khach::dauTrang}"></header><main class="container page-section"><section class="auth-card mx-auto"><p class="eyebrow">CHIA SẺ TRẢI NGHIỆM</p><h1 class="h3">Đánh giá kỳ nghỉ</h1><p>Đơn <strong th:text="${ct.don.maDatPhong}"></strong></p><div th:replace="~{layout/chung::thongBao}"></div><form th:action="@{/danh-gia/{ma}(ma=${ct.don.maDatPhong})}" th:object="${danhGiaDto}" method="post" data-kiem-tra><div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}"><ul><li th:each="e:${#fields.allErrors()}" th:text="${e}"></li></ul></div><label class="form-label" for="soSao">Mức độ hài lòng</label><select class="form-select mb-3" th:field="*{soSao}" required><option th:each="i:${#numbers.sequence(5,1,-1)}" th:value="${i}" th:text="${i}+' sao'"></option></select><label class="form-label" for="noiDung">Nội dung</label><textarea class="form-control mb-4" rows="5" maxlength="500" th:field="*{noiDung}"></textarea><button class="btn btn-primary w-100" type="submit">Gửi đánh giá</button></form></section></main><footer th:replace="~{layout/khach::chanTrang}"></footer><th:block th:replace="~{layout/chung::scripts}"></th:block></body></html>
