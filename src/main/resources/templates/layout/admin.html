<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<aside th:fragment="sidebar" class="admin-sidebar offcanvas-lg offcanvas-start" tabindex="-1" id="menuQuanTri" aria-label="Menu quản trị">
    <div class="offcanvas-header d-lg-none"><h2 class="offcanvas-title h5">Điều hướng</h2><button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" data-bs-target="#menuQuanTri" aria-label="Đóng menu"></button></div>
    <div class="sidebar-inner">
        <a class="brand sidebar-brand" th:href="@{/admin}"><span class="brand-mark"><i class="bi bi-buildings" aria-hidden="true"></i></span> KHÁCH SẠN</a>
        <p class="sidebar-eyebrow">KHÔNG GIAN LÀM VIỆC</p>
        <nav class="sidebar-nav" aria-label="Chức năng quản trị">
            <a th:href="@{/admin}"><i class="bi bi-grid" aria-hidden="true"></i> Tổng quan</a>
            <a sec:authorize="hasAnyRole('VT01','VT02')" th:href="@{/admin/tim-phong}"><i class="bi bi-search" aria-hidden="true"></i> Tìm phòng trống</a>
            <th:block sec:authorize="hasRole('VT01')">
                <a th:href="@{/admin/dat-phong/can-xac-nhan}"><i class="bi bi-calendar-check" aria-hidden="true"></i> Đơn cần xác nhận</a>
                <a th:href="@{/admin/nhan-tra-phong/check-in}"><i class="bi bi-box-arrow-in-right" aria-hidden="true"></i> Check-in</a>
                <a th:href="@{/admin/nhan-tra-phong/check-out}"><i class="bi bi-box-arrow-right" aria-hidden="true"></i> Check-out &amp; hóa đơn</a>
            </th:block>
            <a sec:authorize="hasRole('VT03')" th:href="@{/admin/phong/tinh-trang}"><i class="bi bi-door-open" aria-hidden="true"></i> Tình trạng phòng</a>
            <th:block sec:authorize="hasRole('VT02')">
                <a th:href="@{/admin/phong}"><i class="bi bi-door-closed" aria-hidden="true"></i> Loại phòng &amp; phòng</a>
                <a th:href="@{/admin/nhan-vien}"><i class="bi bi-people" aria-hidden="true"></i> Nhân viên</a>
                <a th:href="@{/admin/dat-phong}"><i class="bi bi-calendar2-week" aria-hidden="true"></i> Quản lý đặt phòng</a>
                <a th:href="@{/admin/bao-cao}"><i class="bi bi-bar-chart" aria-hidden="true"></i> Báo cáo doanh thu</a>
                <a th:href="@{/admin/tham-so}"><i class="bi bi-sliders" aria-hidden="true"></i> Cấu hình tham số</a>
            </th:block>
        </nav>
        <div class="sidebar-bottom">
            <a class="sidebar-public" th:href="@{/}"><i class="bi bi-arrow-up-right me-2" aria-hidden="true"></i> Xem website khách hàng</a>
            <form th:action="@{/admin/dang-xuat}" method="post"><button class="btn sidebar-logout w-100" type="submit"><i class="bi bi-box-arrow-left me-2" aria-hidden="true"></i> Đăng xuất</button></form>
        </div>
    </div>
</aside>
<header th:fragment="topbar" class="admin-topbar">
    <div class="d-flex align-items-center gap-3"><button class="btn btn-outline-primary d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#menuQuanTri" aria-controls="menuQuanTri" aria-label="Mở menu quản trị"><i class="bi bi-list" aria-hidden="true"></i></button><span class="text-secondary small">Quản trị khách sạn</span></div>
    <div class="account-info"><span class="account-avatar"><i class="bi bi-person" aria-hidden="true"></i></span><div><strong class="d-block small" th:text="${tenNguoiDung}">Nhân viên</strong><span class="text-secondary small" sec:authorize="hasRole('VT01')">Lễ tân</span><span class="text-secondary small" sec:authorize="hasRole('VT02')">Quản lý</span><span class="text-secondary small" sec:authorize="hasRole('VT03')">Buồng phòng</span></div></div>
</header>
</body>
</html>
