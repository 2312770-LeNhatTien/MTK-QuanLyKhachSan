<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Xác nhận đặt phòng</title></head><body><h1>Khách sạn – Xác nhận đặt phòng</h1><p>Kính chào <span th:text="${ct.don.khachHang.hoTen}"></span>,</p><p>Đơn <strong th:text="${ct.don.maDatPhong}"></strong> đã được xác nhận.</p><p>Ngày nhận: <span th:text="${dinhDang.ngay(ct.don.ngayNhanPhong)}"></span> – Ngày trả: <span th:text="${dinhDang.ngay(ct.don.ngayTraPhong)}"></span></p><table border="1" cellpadding="8"><tr><th>Nội dung</th><th>Cách tính</th><th>Thành tiền</th></tr><tr th:each="d:${ct.chiPhi.chiTiet()}"><td th:text="${d.noiDung}"></td><td th:text="${d.cachTinh}"></td><td th:text="${dinhDang.tien(d.thanhTien)}"></td></tr></table><p>Tổng tiền: <strong th:text="${dinhDang.tien(ct.don.tongTien)}"></strong></p><p>Đã trả: <strong th:text="${dinhDang.tien(ct.daTra)}"></strong></p><p>Cảm ơn bạn đã lựa chọn khách sạn.</p></body></html>
