<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout/chung::head('Kết quả thanh toán')}"></head><body><header th:replace="~{layout/khach::dauTrang}"></header><main class="container page-section"><section class="auth-card mx-auto"><p class="eyebrow">KẾT QUẢ GIAO DỊCH</p><h1 class="h3" th:text="${giaoDich.trangThai.tenHienThi}"></h1><p>Mã giao dịch: <strong th:text="${giaoDich.maThanhToan}"></strong></p><p>Số tiền: <strong th:text="${@dinhDang.tien(giaoDich.soTien)}"></strong></p><div class="alert alert-success" th:if="${giaoDich.trangThai.name()=='THANH_CONG'}">Đặt phòng đã được xác nhận. Bạn có thể xem chi tiết trong lịch sử đặt phòng.</div><div class="alert alert-warning" th:unless="${giaoDich.trangThai.name()=='THANH_CONG'}">Giao dịch chưa thành công. Bạn có thể thử lại nếu đơn vẫn còn thời gian giữ phòng.</div><div class="d-flex flex-wrap gap-2"><a class="btn btn-primary" th:href="@{/dat-phong/{ma}(ma=${giaoDich.hoaDon.datPhong.maDatPhong})}">Xem đơn đặt phòng</a><a class="btn btn-outline-primary" th:if="${giaoDich.trangThai.name()=='THAT_BAI'}" th:href="@{/thanh-toan/{ma}(ma=${giaoDich.hoaDon.datPhong.maDatPhong})}">Thanh toán lại</a></div></section></main><footer th:replace="~{layout/khach::chanTrang}"></footer><th:block th:replace="~{layout/chung::scripts}"></th:block></body></html>
