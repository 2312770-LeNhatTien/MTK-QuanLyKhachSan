<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout/chung::head('Thanh toán đặt phòng')}"></head><body><header th:replace="~{layout/khach::dauTrang}"></header>
<main class="container page-section"><p class="eyebrow">HOÀN TẤT ĐẶT PHÒNG</p><h1 class="h2">Thanh toán <span th:text="${ct.don.maDatPhong}"></span></h1><div th:replace="~{layout/chung::thongBao}"></div>
<div class="row g-4 mt-2"><div class="col-lg-7"><section class="content-card"><div th:replace="~{layout/chi-phi::bang(${ct.chiPhi})}"></div><p>Đã trả: <strong th:text="${@dinhDang.tien(ct.daTra)}"></strong> · Còn lại: <strong th:text="${@dinhDang.tien(ct.conLai)}"></strong></p></section></div><div class="col-lg-5"><section class="content-card">
<div th:if="${ct.coTheThanhToan}"><div class="alert alert-warning">Thời gian giữ phòng còn <strong id="demNguoc" th:attr="data-het-han=${ct.hetHan.toString()+'+07:00'}"></strong></div>
<form th:action="@{/thanh-toan/{ma}(ma=${ct.don.maDatPhong})}" th:object="${thanhToanDto}" method="post" data-kiem-tra id="formThanhToan"><label for="toanBo" class="form-label">Khoản thanh toán</label><select class="form-select mb-3" th:field="*{toanBo}"><option value="true">Thanh toán toàn bộ số còn lại</option><option value="false">Đặt cọc</option></select><label for="soTien" class="form-label">Số tiền đặt cọc</label><input class="form-control mb-2" type="number" name="soTien" id="soTien" step="0.01" th:min="${cocToiThieu}" th:max="${ct.conLai}" th:value="${cocToiThieu}"><p class="small text-secondary">Tối thiểu <span th:text="${@dinhDang.tien(cocToiThieu)}"></span>.</p><label for="maPhuongThuc" class="form-label">Phương thức</label><select class="form-select mb-4" th:field="*{maPhuongThuc}" required><option th:each="p:${dsPhuongThuc}" th:value="${p.ma}" th:text="${p.tenHienThi}"></option></select><button class="btn btn-primary w-100" type="submit">Đến cổng thanh toán</button></form></div>
<div th:unless="${ct.coTheThanhToan}" class="alert alert-info">Đơn không còn trong thời gian chờ thanh toán.</div></section></div></div></main><footer th:replace="~{layout/khach::chanTrang}"></footer><th:block th:replace="~{layout/chung::scripts}"></th:block><script th:src="@{/js/dat-phong.js}"></script></body></html>
