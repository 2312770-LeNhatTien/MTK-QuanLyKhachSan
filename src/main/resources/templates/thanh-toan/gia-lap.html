<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout/chung::head('Cổng thanh toán giả lập')}"></head><body class="staff-login-page"><main class="staff-login-shell"><section class="auth-card"><span class="staff-login-icon"><i class="bi bi-credit-card" aria-hidden="true"></i></span><p class="eyebrow mt-4">MÔ PHỎNG THANH TOÁN</p><h1 class="h3">Cổng thanh toán giả lập</h1><p class="text-secondary">Không thu tiền thật và không yêu cầu thông tin thẻ.</p><dl><dt>Mã giao dịch</dt><dd th:text="${giaoDich.maThanhToan}"></dd><dt>Số tiền</dt><dd class="h3" th:text="${@dinhDang.tien(giaoDich.soTien)}"></dd></dl><form th:action="@{/thanh-toan/gia-lap/{ma}(ma=${giaoDich.maThanhToan})}" method="post" class="d-grid gap-3" th:if="${giaoDich.trangThai.name()=='DANG_XU_LY'}"><button class="btn btn-primary" type="submit" name="thanhCong" value="true">Thanh toán thành công</button><button class="btn btn-outline-danger" type="submit" name="thanhCong" value="false">Thanh toán thất bại</button></form><a th:unless="${giaoDich.trangThai.name()=='DANG_XU_LY'}" class="btn btn-primary" th:href="@{/thanh-toan/ket-qua/{ma}(ma=${giaoDich.maThanhToan})}">Xem kết quả</a></section></main><th:block th:replace="~{layout/chung::scripts}"></th:block></body></html>
